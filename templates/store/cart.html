<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سلة المشتريات</title>
</head>
<body>
    {% include 'header.html' %}

    <div style="padding: 40px;">
        <h2 style="text-align: center; color: #c9184a;">🛒 سلة المشتريات</h2>

        {% if products %}
            <ul style="list-style: none; padding: 0;">
                {% for product in products %}
                    <li style="margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 0 5px rgba(0,0,0,0.1);">
                        {{ product.name }} - {{ product.price }} ريال
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p style="text-align: center; color: gray;">السلة فارغة حالياً.</p>
        {% endif %}
    </div>

    {% include 'footer.html' %}
</body>
</html>
