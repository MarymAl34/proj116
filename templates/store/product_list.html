<section style="padding: 40px 20px; background-color: #fff0f5;">
    <h2 style="text-align: center; color: #c9184a; margin-bottom: 30px;">قائمة المنتجات</h2>

    {% if products %}
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; max-width: 1200px; margin: 0 auto;">
            {% for product in products %}
                <div style="background: #fff; border-radius: 12px; padding: 15px; width: 280px; box-shadow: 0 0 10px rgba(248, 165, 194, 0.3); transition: 0.3s; text-align: center;">
                    
                    {% if product.image %}
                        <img src="{{ product.image.url }}" alt="{{ product.name }}"
                             style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px;">
                    {% else %}
                        <div style="width: 100%; height: 200px; background-color: #f8d7da; border-radius: 8px;
                                    display: flex; align-items: center; justify-content: center; color: #721c24; margin-bottom: 15px;">
                            لا توجد صورة
                        </div>
                    {% endif %}

                    <h3 style="color: #c9184a; font-size: 18px; margin-bottom: 10px;">{{ product.name }}</h3>
                    <p style="color: #555; font-size: 14px; margin-bottom: 10px;">
                        {{ product.description|truncatechars:100 }}
                    </p>
                    <p style="font-weight: bold; color: #d63384;">السعر: {{ product.price }} ريال</p>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p style="text-align: center; color: gray;">لا توجد منتجات متاحة حالياً.</p>
    {% endif %}
</section>
